<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demotestlar.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; }
        .admin-form input, .admin-form textarea, .admin-form select { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:disabled { background: #bdc3c7; }
        .img-preview { max-width: 100%; max-height: 150px; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ Янги савол қўшиш</h2>
    <div class="admin-form">
        <label><b>Тест номи:</b></label>
        <select id="test-select">
            <option value="demo_5">Demo-5 (kuz 2026)</option>
            <option value="demo_6">Demo-6 (kuz 2026)</option>
        </select>

        <label><b>Матн (Ихтиёрий):</b></label>
        <textarea id="reading-text" rows="2" placeholder="Матнни киритинг..."></textarea>

        <label><b>Расм (Ихтиёрий):</b></label>
        <input type="file" id="img-file" accept="image/*" onchange="handleImg(event)">
        <img id="img-preview" class="img-preview">

        <label><b>Савол матни:</b></label>
        <input type="text" id="question" placeholder="Саволни киритинг">

        <label><b>Вариантлар:</b></label>
        <input type="text" id="opt-0" placeholder="A) Вариант 1">
        <input type="text" id="opt-1" placeholder="B) Вариант 2">
        <input type="text" id="opt-2" placeholder="C) Вариант 3">
        <input type="text" id="opt-3" placeholder="D) Вариант 4">

        <label><b>Тўғри жавоб:</b></label>
        <select id="correct-opt">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
        </select>

        <button type="button" id="save-btn" onclick="saveQuestion()">💾 Сақлаш</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://pudegdogypbxytbdizow.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KOhS1ubVAnOu1PM8r2IP3Q_KF8t0Te1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let compressedImg = null;

    function handleImg(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const scale = 300 / img.width;
                canvas.width = 300;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                compressedImg = canvas.toDataURL('image/jpeg', 0.3);
                document.getElementById('img-preview').src = compressedImg;
                document.getElementById('img-preview').style.display = 'block';
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function saveQuestion() {
        const btn = document.getElementById('save-btn');
        const qText = document.getElementById('question').value.trim();
        const o0 = document.getElementById('opt-0').value.trim();
        const o1 = document.getElementById('opt-1').value.trim();
        const o2 = document.getElementById('opt-2').value.trim();
        const o3 = document.getElementById('opt-3').value.trim();

        if (!qText || !o0 || !o1) {
            alert('Савол ва вариантларни тўлдиринг!');
            return;
        }

        btn.disabled = true;
        btn.innerText = '⏳ Сақланмоқда...';

        const payload = {
            test_id: document.getElementById('test-select').value,
            reading_text: document.getElementById('reading-text').value.trim() || null,
            image_url: compressedImg,
            question: qText,
            options: [o0, o1, o2, o3].filter(Boolean),
            correct: parseInt(document.getElementById('correct-opt').value)
        };

        const { error } = await supabaseClient.from('questions').insert([payload]);

        btn.disabled = false;
        btn.innerText = '💾 Сақлаш';

        if (error) {
            alert('Хатолик: ' + error.message);
        } else {
            alert('Муваффақиятли сақланди!');
            document.getElementById('question').value = '';
            document.getElementById('opt-0').value = '';
            document.getElementById('opt-1').value = '';
            document.getElementById('opt-2').value = '';
            document.getElementById('opt-3').value = '';
            document.getElementById('img-preview').style.display = 'none';
            compressedImg = null;
        }
    }
</script>
</body>
</html>
